<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Account Security Notice</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Consolas, Monaco, monospace;
      background: #000;
      color: #39ff88;
    }

    body {
      overflow: hidden;
    }

    /* =====================================================
       TERMINAL SCREEN
       ===================================================== */

    #hackingScreen {
      position: fixed;
      inset: 0;
      background: #000;
      padding: 28px;
      display: none;
      flex-direction: column;
    }

    #terminal {
      white-space: pre-wrap;
      line-height: 1.65;
      font-size: 15px;
      overflow: hidden;
      flex: 1;
    }

    .red {
      color: #ff4d4d;
    }

    .yellow {
      color: #ffd84d;
    }

    .green {
      color: #39ff88;
    }

    .muted {
      color: #777;
    }

    .bar {
      height: 18px;
      border: 1px solid #39ff88;
      margin-top: 14px;
      max-width: 760px;
    }

    .fill {
      height: 100%;
      width: 0;
      background: #39ff88;
      transition: width .2s;
    }


    /* =====================================================
       FINAL SECURITY SCREEN
       ===================================================== */

    #awarenessScreen {
      display: none;
      position: fixed;
      inset: 0;

      background: #000;

      color: #fff;

      align-items: center;
      justify-content: center;

      padding: 0;

      font-family: Arial, Helvetica, sans-serif;

      overflow: hidden;
    }


    /* Matrix background */

    #matrixCanvas {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;
    }


    /* Hacker image */

    .hacker-image {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;

      opacity: 0;

      animation:
        hackerAppear 1.2s ease forwards;
    }


    /* Dark overlay */

    .hacker-overlay {
      position: absolute;

      inset: 0;

      z-index: 2;

      background:
        radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.78)
        );
    }


    /* =====================================================
       HACKED MESSAGE
       ===================================================== */

    .hacked-alert {
      position: relative;

      z-index: 3;

      text-align: center;

      width: 90%;

      max-width: 1000px;

      opacity: 0;

      animation:
        alertAppear 1s ease .8s forwards;
    }


    .hacked-title {
      font-size:
        clamp(48px, 9vw, 110px);

      font-weight: 900;

      color: #ff2222;

      letter-spacing: 5px;

      margin: 0;

      text-shadow:
        0 0 8px #ff0000,
        0 0 25px rgba(255, 0, 0, .8),
        0 0 60px rgba(255, 0, 0, .5);

      animation:
        glitch 1.5s infinite;
    }


    .hacked-subtitle {
      margin-top: 18px;

      font-family: Consolas, Monaco, monospace;

      font-size:
        clamp(16px, 2vw, 25px);

      color: #fff;

      text-shadow:
        0 0 10px #000;
    }


    .critical {
      display: inline-block;

      margin-top: 25px;

      padding: 10px 24px;

      border:
        2px solid #ff2222;

      color: #ff4444;

      background:
        rgba(0, 0, 0, .75);

      font-family:
        Consolas, Monaco, monospace;

      font-weight: bold;

      letter-spacing: 3px;

      animation:
        pulse 1s infinite;
    }


    /* =====================================================
       AWARENESS REVEAL
       ===================================================== */

    .awareness-reveal {
      display: none;

      position: relative;

      z-index: 5;

      max-width: 700px;

      width: 90%;

      padding: 35px;

      text-align: center;

      background:
        rgba(0, 0, 0, .94);

      border:
        2px solid #39ff88;

      border-radius: 12px;

      box-shadow:
        0 0 30px rgba(57, 255, 136, .5),
        0 0 80px rgba(57, 255, 136, .2);
    }


    .awareness-reveal h2 {
      color: #39ff88;

      font-size: 34px;

      margin-top: 0;
    }


    .awareness-reveal p {
      color: #fff;

      font-size: 17px;

      line-height: 1.6;
    }


    .green-text {
      color: #39ff88;

      font-weight: bold;
    }


    /* =====================================================
       ANIMATIONS
       ===================================================== */

    @keyframes hackerAppear {

      from {
        opacity: 0;

        transform:
          scale(1.05);
      }

      to {
        opacity: 1;

        transform:
          scale(1);
      }

    }


    @keyframes alertAppear {

      from {
        opacity: 0;

        transform:
          scale(.8);
      }

      to {
        opacity: 1;

        transform:
          scale(1);
      }

    }


    @keyframes glitch {

      0%,
      90%,
      100% {
        transform:
          translate(0);
      }

      92% {
        transform:
          translate(-4px, 2px);
      }

      94% {
        transform:
          translate(4px, -2px);
      }

      96% {
        transform:
          translate(-2px, 1px);
      }

    }


    @keyframes pulse {

      0%,
      100% {
        box-shadow:
          0 0 5px
          rgba(255, 34, 34, .3);
      }

      50% {
        box-shadow:
          0 0 25px
          rgba(255, 34, 34, .8);
      }

    }

  </style>
</head>


<body>


  <!-- =====================================================
       TERMINAL SCREEN
       ===================================================== -->

  <section id="hackingScreen">

    <div id="terminal"></div>

    <div class="bar">

      <div
        id="fill"
        class="fill">
      </div>

    </div>

  </section>



  <!-- =====================================================
       FINAL SCREEN
       ===================================================== -->

  <section id="awarenessScreen">


    <!-- Matrix background -->

    <canvas
      id="matrixCanvas">
    </canvas>


    <!-- Generated hacker image -->

    <img
      src="/hacker-alert.png"
      class="hacker-image"
      alt="Security alert"
    >


    <!-- Dark overlay -->

    <div
      class="hacker-overlay">
    </div>



    <!-- =================================================
         INITIAL HACKED MESSAGE
         ================================================= -->

    <div
      class="hacked-alert"
      id="hackedAlert">


      <h1 class="hacked-title">

        SYSTEM HACKED

      </h1>


      <div class="hacked-subtitle">

        UNAUTHORIZED ACCESS DETECTED

      </div>


      <div class="critical">

        ⚠ CRITICAL SECURITY ALERT ⚠

      </div>


    </div>



    <!-- =================================================
         AWARENESS REVEAL
         ================================================= -->

    <div
      class="awareness-reveal"
      id="awarenessReveal">


      <h2>YOUR SYSTEM IS HACKED. WE HAVE TAKEN ALL YOUR DATA</h2>

  <p>
    THANK YOU FOR CLICKING THE LINK.
  </p>

    </div>


  </section>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       AUTHENTICATION CHECK
       ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const authenticated =
      params.get("authenticated");


    /*
      If the user has not completed
      Microsoft authentication,
      send them to the login function.
    */

    if (authenticated !== "1") {


      window.location.replace(
        "/.netlify/functions/login"
      );


    }


    else {


      /* =================================================
         ELEMENTS
         ================================================= */

      const hackingScreen =
        document.getElementById(
          "hackingScreen"
        );


      const awarenessScreen =
        document.getElementById(
          "awarenessScreen"
        );


      const terminal =
        document.getElementById(
          "terminal"
        );


      const fill =
        document.getElementById(
          "fill"
        );


      /* =================================================
         SHOW TERMINAL
         ================================================= */

      hackingScreen.style.display =
        "flex";


      /* =================================================
         TERMINAL MESSAGES
         ================================================= */

      const lines = [

        [
          "[SYSTEM] Initializing security diagnostic...",
          "green"
        ],

        [
          "[NETWORK] Checking connection...",
          "green"
        ],

        [
          "[AUTH] Unexpected account activity detected.",
          "yellow"
        ],

        [
          "[SCAN] Reviewing security events...",
          "green"
        ],

        [
          "[WARNING] Suspicious link interaction detected.",
          "red"
        ],

        [
          "[SCAN] Checking endpoint status...",
          "green"
        ],

        [
          "[ALERT] Security awareness trigger activated.",
          "red"
        ],

        [
          "[SYSTEM] Preparing security notice...",
          "yellow"
        ]

      ];


      let i = 0;

      let progress = 0;


      /* =================================================
         ADD TERMINAL LINE
         ================================================= */

      function addLine() {


        if (i >= lines.length) {


          setTimeout(() => {


            hackingScreen.style.display =
              "none";


            awarenessScreen.style.display =
              "flex";


            startMatrix();


          }, 800);


          return;

        }


        const [
          text,
          cls
        ] = lines[i++];


        const div =
          document.createElement(
            "div"
          );


        div.className =
          cls;


        div.textContent =
          text;


        terminal.appendChild(
          div
        );


        terminal.scrollTop =
          terminal.scrollHeight;


        progress =
          Math.min(
            100,
            progress + 12.5
          );


        fill.style.width =
          progress + "%";


        setTimeout(
          addLine,
          700
        );

      }


      addLine();



      /* =================================================
         MATRIX EFFECT
         ================================================= */

      function startMatrix() {


        const canvas =
          document.getElementById(
            "matrixCanvas"
          );


        const ctx =
          canvas.getContext(
            "2d"
          );


        function resize() {


          canvas.width =
            window.innerWidth;


          canvas.height =
            window.innerHeight;


          columns =
            Math.floor(
              window.innerWidth /
              fontSize
            );


          drops =
            Array(columns)
              .fill(1);

        }


        const characters =
          "アァカサタナハマヤャラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";


        const fontSize =
          16;


        let columns =
          Math.floor(
            window.innerWidth /
            fontSize
          );


        let drops =
          Array(columns)
            .fill(1);


        resize();


        window.addEventListener(
          "resize",
          resize
        );


        function draw() {


          ctx.fillStyle =
            "rgba(0, 0, 0, 0.08)";


          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );


          ctx.fillStyle =
            "#39ff88";


          ctx.font =
            fontSize +
            "px monospace";


          for (
            let i = 0;
            i < drops.length;
            i++
          ) {


            const character =
              characters[
                Math.floor(
                  Math.random() *
                  characters.length
                )
              ];


            ctx.fillText(
              character,

              i * fontSize,

              drops[i] *
              fontSize
            );


            if (
              drops[i] *
              fontSize >
              canvas.height &&
              Math.random() >
              0.975
            ) {

              drops[i] = 0;

            }


            drops[i]++;

          }

        }


        setInterval(
          draw,
          35
        );


        /* =================================================
           HACKED SCREEN → AWARENESS REVEAL

           Keep the dramatic screen visible
           for 7 seconds.
           ================================================= */

        setTimeout(() => {


          const hackedAlert =
            document.getElementById(
              "hackedAlert"
            );


          const awarenessReveal =
            document.getElementById(
              "awarenessReveal"
            );


          hackedAlert.style.transition =
            "opacity 0.8s ease";


          hackedAlert.style.opacity =
            "0";


          setTimeout(() => {


            hackedAlert.style.display =
              "none";


            awarenessReveal.style.display =
              "block";


          }, 800);


        }, 7000);


      }


    }


  </script>

</body>
</html>
