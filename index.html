<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account Security Notice</title>

  <style>
    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      font-family:Consolas,Monaco,monospace;
      background:#000;
      color:#39ff88
    }

    body{
      overflow:hidden
    }

    #hackingScreen{
      position:fixed;
      inset:0;
      background:#000;
      padding:28px;
      display:none;
      flex-direction:column
    }

    #terminal{
      white-space:pre-wrap;
      line-height:1.65;
      font-size:15px;
      overflow:hidden;
      flex:1
    }

    .red{color:#ff4d4d}
    .yellow{color:#ffd84d}
    .green{color:#39ff88}
    .muted{color:#777}

    .bar{
      height:18px;
      border:1px solid #39ff88;
      margin-top:14px;
      max-width:760px
    }

    .fill{
      height:100%;
      width:0;
      background:#39ff88;
      transition:width .2s
    }

    #awarenessScreen{
      display:none;
      position:fixed;
      inset:0;
      background:#f7f7f7;
      color:#111;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Arial,Helvetica,sans-serif
    }

    .card{
      max-width:680px;
      width:100%;
      background:#fff;
      border-radius:16px;
      padding:38px;
      box-shadow:0 12px 40px rgba(0,0,0,.15);
      text-align:center
    }

    .icon{
      font-size:54px;
      margin-bottom:8px
    }

    h1{
      margin:6px 0 18px;
      font-size:32px
    }

    p{
      font-size:17px;
      line-height:1.6;
      margin:10px 0
    }

    .small{
      font-size:13px;
      color:#666;
      margin-top:22px
    }
  </style>
</head>

<body>

<section id="hackingScreen">
  <div id="terminal"></div>

  <div class="bar">
    <div id="fill" class="fill"></div>
  </div>
</section>


<section id="awarenessScreen">

  <div class="card">

    <div class="icon">⚠️</div>

    <h1>YOU CLICKED IT</h1>

    <p>
      <strong>
        This was an authorized IT security awareness exercise.
      </strong>
    </p>

    <p>
      No password was collected.<br>
      No account was compromised.
    </p>

    <p>
      <strong>
        Think before clicking links in unexpected emails.
      </strong>
    </p>

    <p class="small">
      Cybersecurity Awareness • IT Department
    </p>

  </div>

</section>


<script>

const params = new URLSearchParams(window.location.search);

const authenticated = params.get("authenticated");


/*
  IMPORTANT:

  If the user has not authenticated yet,
  immediately send them to Microsoft login.

  The black-screen simulation does NOT run before login.
*/
if (authenticated !== "1") {

  window.location.replace("/.netlify/functions/login");

} else {

  /*
    Authentication succeeded.

    Now start the awareness simulation.
  */

  const hackingScreen =
    document.getElementById("hackingScreen");

  const awarenessScreen =
    document.getElementById("awarenessScreen");

  const terminal =
    document.getElementById("terminal");

  const fill =
    document.getElementById("fill");


  hackingScreen.style.display = "flex";


  const lines = [

    ["[SYSTEM] Initializing security diagnostic...", "green"],

    ["[NETWORK] Checking connection...", "green"],

    ["[AUTH] Unexpected account activity detected.", "yellow"],

    ["[SCAN] Reviewing security events...", "green"],

    ["[WARNING] Suspicious link interaction detected.", "red"],

    ["[SCAN] Checking endpoint status...", "green"],

    ["[ALERT] Security awareness trigger activated.", "red"],

    ["[SYSTEM] Preparing security notice...", "yellow"]

  ];


  let i = 0;

  let progress = 0;


  function addLine() {

    if (i >= lines.length) {

      setTimeout(() => {

        hackingScreen.style.display = "none";

        awarenessScreen.style.display = "flex";

      }, 800);

      return;
    }


    const [text, cls] = lines[i++];


    const div = document.createElement("div");

    div.className = cls;

    div.textContent = text;


    terminal.appendChild(div);


    terminal.scrollTop =
      terminal.scrollHeight;


    progress =
      Math.min(100, progress + 12.5);


    fill.style.width =
      progress + "%";


    setTimeout(addLine, 700);

  }


  addLine();

}

</script>

</body>
</html>
