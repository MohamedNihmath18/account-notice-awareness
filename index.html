<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account Security Notice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Consolas, Monaco, monospace;
      background: #000;
      color: #39ff88;
    }

    body {
      overflow: hidden;
    }

    /* =========================
       BLACK TERMINAL SCREEN
       ========================= */

    #hackingScreen {
      position: fixed;
      inset: 0;
      background: #000;
      padding: 28px;
      display: none;
      flex-direction: column;
    }

    #terminal {
      white-space: pre-wrap;
      line-height: 1.65;
      font-size: 15px;
      overflow: hidden;
      flex: 1;
    }

    .red {
      color: #ff4d4d;
    }

    .yellow {
      color: #ffd84d;
    }

    .green {
      color: #39ff88;
    }

    .muted {
      color: #777;
    }

    .bar {
      height: 18px;
      border: 1px solid #39ff88;
      margin-top: 14px;
      max-width: 760px;
    }

    .fill {
      height: 100%;
      width: 0;
      background: #39ff88;
      transition: width .2s;
    }


    /* =========================
       MATRIX AWARENESS SCREEN
       ========================= */

    #awarenessScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      color: #39ff88;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #matrixCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 2;

      max-width: 680px;
      width: 100%;

      background: rgba(0, 0, 0, .88);

      border: 1px solid #39ff88;
      border-radius: 12px;

      padding: 38px;

      box-shadow:
        0 0 20px rgba(57, 255, 136, .35),
        0 0 60px rgba(57, 255, 136, .15);

      text-align: center;
    }

    .icon {
      font-size: 54px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 6px 0 18px;
      font-size: 32px;

      color: #ff4d4d;

      text-shadow:
        0 0 12px rgba(255, 77, 77, .7);
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      margin: 10px 0;
      color: #fff;
    }

    .small {
      font-size: 13px;
      color: #39ff88;
      margin-top: 22px;
    }

  </style>
</head>


<body>


  <!-- =========================
       BLACK TERMINAL
       ========================= -->

  <section id="hackingScreen">

    <div id="terminal"></div>

    <div class="bar">
      <div id="fill" class="fill"></div>
    </div>

  </section>



  <!-- =========================
       MATRIX AWARENESS SCREEN
       ========================= -->

  <section id="awarenessScreen">

    <canvas id="matrixCanvas"></canvas>

    <div class="card">

      <div class="icon">⚠️</div>

      <h1>YOU CLICKED IT</h1>

      <p>
        <strong>
          This was an authorized IT security awareness exercise.
        </strong>
      </p>

      <p>
        No password was collected.<br>
        No account was compromised.
      </p>

      <p>
        <strong>
          Think before clicking links in unexpected emails.
        </strong>
      </p>

      <p class="small">
        Cybersecurity Awareness • IT Department
      </p>

    </div>

  </section>



  <script>

    /*
      ==========================================
      AUTHENTICATION-FIRST FLOW
      ==========================================

      User clicks the link
              ↓
      Microsoft login
              ↓
      Authentication callback
              ↓
      Email recorded
              ↓
      Redirect back with authenticated=1
              ↓
      Simulation starts
    */


    const params =
      new URLSearchParams(window.location.search);

    const authenticated =
      params.get("authenticated");


    /*
      If authentication has NOT happened,
      immediately send the user to Microsoft login.
    */

    if (authenticated !== "1") {

      window.location.replace(
        "/.netlify/functions/login"
      );

    }

    else {

      /*
        ==========================================
        AUTHENTICATED
        START SIMULATION
        ==========================================
      */

      const hackingScreen =
        document.getElementById("hackingScreen");

      const awarenessScreen =
        document.getElementById("awarenessScreen");

      const terminal =
        document.getElementById("terminal");

      const fill =
        document.getElementById("fill");


      /*
        Show black terminal.
      */

      hackingScreen.style.display = "flex";


      /*
        Terminal messages.
      */

      const lines = [

        [
          "[SYSTEM] Initializing security diagnostic...",
          "green"
        ],

        [
          "[NETWORK] Checking connection...",
          "green"
        ],

        [
          "[AUTH] Unexpected account activity detected.",
          "yellow"
        ],

        [
          "[SCAN] Reviewing security events...",
          "green"
        ],

        [
          "[WARNING] Suspicious link interaction detected.",
          "red"
        ],

        [
          "[SCAN] Checking endpoint status...",
          "green"
        ],

        [
          "[ALERT] Security awareness trigger activated.",
          "red"
        ],

        [
          "[SYSTEM] Preparing security notice...",
          "yellow"
        ]

      ];


      let i = 0;

      let progress = 0;


      /*
        Add terminal lines one by one.
      */

      function addLine() {

        if (i >= lines.length) {

          /*
            Terminal finished.

            Wait briefly, then show
            the Matrix awareness screen.
          */

          setTimeout(() => {

            hackingScreen.style.display =
              "none";

            awarenessScreen.style.display =
              "flex";

            startMatrix();

          }, 800);

          return;
        }


        const [text, cls] =
          lines[i++];


        const div =
          document.createElement("div");

        div.className =
          cls;

        div.textContent =
          text;


        terminal.appendChild(div);


        terminal.scrollTop =
          terminal.scrollHeight;


        progress =
          Math.min(
            100,
            progress + 12.5
          );


        fill.style.width =
          progress + "%";


        setTimeout(
          addLine,
          700
        );

      }


      addLine();


      /*
        ==========================================
        MATRIX EFFECT
        ==========================================
      */

      function startMatrix() {

        const canvas =
          document.getElementById(
            "matrixCanvas"
          );

        const ctx =
          canvas.getContext("2d");


        function resize() {

          canvas.width =
            window.innerWidth;

          canvas.height =
            window.innerHeight;

        }


        resize();


        window.addEventListener(
          "resize",
          resize
        );


        const characters =
          "アァカサタナハマヤャラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";


        const fontSize =
          16;


        let columns =
          Math.floor(
            window.innerWidth /
            fontSize
          );


        let drops =
          Array(columns).fill(1);


        function draw() {

          /*
            Slowly fade previous characters.
          */

          ctx.fillStyle =
            "rgba(0, 0, 0, 0.08)";


          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );


          /*
            Matrix character color.
          */

          ctx.fillStyle =
            "#39ff88";


          ctx.font =
            fontSize +
            "px monospace";


          for (
            let i = 0;
            i < drops.length;
            i++
          ) {

            const character =
              characters[
                Math.floor(
                  Math.random() *
                  characters.length
                )
              ];


            ctx.fillText(
              character,
              i * fontSize,
              drops[i] * fontSize
            );


            /*
              Restart drops when they
              reach the bottom.
            */

            if (
              drops[i] * fontSize >
                canvas.height &&
              Math.random() > 0.975
            ) {

              drops[i] = 0;

            }


            drops[i]++;

          }

        }


        /*
          Run Matrix animation.
        */

        setInterval(
          draw,
          35
        );

      }

    }

  </script>

</body>
</html>
